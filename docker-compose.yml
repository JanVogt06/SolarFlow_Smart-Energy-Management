services:
  solarflow:
    image: ghcr.io/janvogt06/solarflow:latest
    build: .
    container_name: solarflow
    restart: unless-stopped
    # Zeit zum Ausschalten der Geräte beim Stoppen
    stop_grace_period: 30s
    ports:
      - "${SOLARFLOW_PORT:-8000}:8000"
    environment:
      # Zeitzone für Statistik, Zeitfenster und Nachttarif
      - TZ=${TZ:-Europe/Berlin}
      # IP-Adresse des Fronius Wechselrichters
      - FRONIUS_IP=${FRONIUS_IP:-192.168.178.90}
      # Philips Hue
      - ENABLE_HUE=${ENABLE_HUE:-True}
      - HUE_BRIDGE_IP=${HUE_BRIDGE_IP:-192.168.178.26}
    volumes:
      # Einstellungen, Geräte, Datenbank, Log und Hue-Schlüssel
      - solarflow-data:/data

volumes:
  solarflow-data:
